name: LinkedIn Job Hunter Agent

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة بين 7:00 UTC و 22:00 UTC (الموافق 10:00 صباحاً حتى منتصف الليل بتوقيت مصر والسعودية)
    - cron: '*/30 7-22 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت لتجربته

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py --run-once

      - name: Save and commit updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db cv_profile.json
          git commit -m "chore: update seen jobs [skip ci]" || echo "No new jobs to commit"
          git push
