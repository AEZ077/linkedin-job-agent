name: LinkedIn Job Hunter Agent

on:
  schedule:
    # يعمل كل 15 دقيقة على مدار الـ 24 ساعة
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت لتجربته
  repository_dispatch:
    types: [run-hunter]

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter Agent
        env:
          TZ: "Asia/Riyadh"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py --run-once

      - name: Save and commit updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db cv_profile.json
          git commit -m "chore: update seen jobs [skip ci]" || echo "No new jobs to commit"
          git pull --rebase origin main || true
          git push || (git pull --rebase origin main && git push)
