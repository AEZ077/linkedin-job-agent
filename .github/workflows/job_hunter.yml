name: LinkedIn Job Hunter Agent

on:
  schedule:
    # أعلى تردد يدعمه GitHub Actions تلقائياً (كل 5 دقائق) كخطة احتياطية
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'إرسال رسالة اختبارية إلى تيليجرام بدلاً من الفحص'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  repository_dispatch:
    types: [run-hunter]

concurrency:
  group: job-hunter-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter Agent (Fast 90s Polling)
        env:
          TZ: "Asia/Riyadh"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.test_telegram }}" = "true" ]; then
            python agent.py --test-telegram
          else
            python agent.py --poll-minutes 3 --interval-seconds 90
          fi

      - name: Save and commit updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db cv_profile.json
          git commit -m "chore: update seen jobs [skip ci]" || echo "No new jobs to commit"
          git pull --rebase origin main || true
          git push || (git pull --rebase origin main && git push)
