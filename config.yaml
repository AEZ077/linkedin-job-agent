# ============================================================
# إعدادات البحث المخصصة للأستاذ: أحمد عيد زكي
# ============================================================

# مسار ملف السيرة الذاتية
cv:
  path: "cv.txt"

# تفاصيل الوظائف المستهدفة
search:
  # كلمات البحث الأساسية (تغطي كافة المسميات والـ 14 دور المطلوبين بذكاء لمنع حظر الطلبات 429)
  keywords:
    - "Account Manager"
    - "Customer Success"
    - "Sales Team Lead"
    - "Sales Supervisor"
    - "Business Development Team Lead"
    - "Customer Experience"

  # المناطق الجغرافية المستهدفة للبحث (مقر الشركة يجب أن يكون في الرياض حصراً)
  locations:
    - "Riyadh, Saudi Arabia"
    - "Saudi Arabia"

  # نطاق وقت نشر الوظيفة في لينكدإن:
  # r86400 = آخر 24 ساعة فقط (يمنع تماماً الوظائف القديمة المنشورة منذ أيام)
  time_range: "r86400"

  # أقصى عدد وظائف يتم جلبها لكل مسمى في كل جولة
  max_jobs_per_keyword: 15

# إعدادات الذكاء الاصطناعي والمطابقة
matching:
  # أقل نسبة تطابق مقبولة لإرسال الإشعار لواتساب
  min_match_score: 70
  gemini_model: "gemini-3.5-flash-lite"
  summary_language: "arabic"

# إعدادات الجدولة الزمنية وساعات العمل
scheduler:
  # التشغيل على مدار الـ 24 ساعة بدون انقطاع
  interval_minutes: 15
  start_hour: 0
  end_hour: 24
  # الحد الأقصى لعمر نشر الوظيفة بالساعات (حتى 24 ساعة لضمان تغطية وظائف المساء والصباح)
  max_posted_hours: 24

# القطاعات الـ 4 المحددة حصراً من المستخدم ومقرها الرياض:
industries:
  - "Software Development"
  - "Information Technology & Services"
  - "Accounting"
  - "Technology, Information and Internet"

# قناة الإشعار: telegram (الأفضل والمجاني 100%) أو email أو callmebot
notifier:
  provider: "telegram"
